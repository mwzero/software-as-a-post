<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sudoku</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#0b0d11;--bg-elevated:#12151c;--card:#181c26;
            --cell-bg:#1c2030;--cell-hover:#252a3e;
            --border:#282d40;--border-thick:#3e4565;
            --fg:#e2e6f0;--fg-dim:#6d7694;
            --accent:#d4956a;--accent-light:#e8b898;
            --accent-dim:rgba(212,149,106,.10);--accent-med:rgba(212,149,106,.20);
            --accent-strong:rgba(212,149,106,.32);
            --error:#ef5350;--error-dim:rgba(239,83,80,.14);
            --success:#66bb6a;--given-color:#f0f2f8;
            --user-color:#d4956a;--note-color:#6b7a9e;
        }
        body{
            font-family:'Outfit',sans-serif;background:var(--bg);color:var(--fg);
            min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;
            padding:14px 10px 32px;overflow-x:hidden;-webkit-font-smoothing:antialiased;
            -webkit-tap-highlight-color:transparent;
        }
        .blob{position:fixed;border-radius:50%;filter:blur(120px);opacity:.12;pointer-events:none;z-index:0}
        .blob-1{width:450px;height:450px;background:var(--accent);top:-150px;right:-100px;animation:bf 25s infinite ease-in-out}
        .blob-2{width:350px;height:350px;background:#4a6fa5;bottom:-100px;left:-80px;animation:bf 25s infinite ease-in-out reverse}
        @keyframes bf{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.05)}66%{transform:translate(-20px,20px) scale(.95)}}

        .container{position:relative;z-index:1;width:100%;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:12px}
        header{text-align:center}
        header h1{font-size:1.8rem;font-weight:800;letter-spacing:-.03em}

        .game-info{width:min(92vw,450px);display:flex;justify-content:space-between;align-items:center;gap:8px}
        .difficulty-tabs{display:flex;gap:3px;background:var(--bg-elevated);border-radius:10px;padding:3px;border:1px solid var(--border)}
        .tab{font-family:'Outfit',sans-serif;font-size:.72rem;font-weight:500;padding:5px 11px;border:none;border-radius:8px;background:transparent;color:var(--fg-dim);cursor:pointer;transition:all .2s}
        .tab:hover{color:var(--fg)}
        .tab.active{background:var(--accent);color:#0b0d11;font-weight:600}
        .stats{display:flex;gap:14px}
        .stat{display:flex;align-items:center;gap:5px;font-size:.84rem;font-weight:500;color:var(--fg-dim)}
        .stat i{font-size:.78rem}
        .error-count{color:var(--error)}

        .actions{display:flex;gap:6px;width:min(92vw,450px)}
        .action-btn{
            flex:1;font-family:'Outfit',sans-serif;font-size:.72rem;font-weight:500;
            padding:9px 0;border:1px solid var(--border);border-radius:10px;
            background:var(--card);color:var(--fg-dim);cursor:pointer;transition:all .12s;
            display:flex;flex-direction:column;align-items:center;gap:2px;
            -webkit-tap-highlight-color:transparent;
        }
        .action-btn i{font-size:.88rem}
        .action-btn:hover{color:var(--fg);border-color:var(--fg-dim);background:var(--cell-hover)}
        .action-btn:active{transform:scale(.95)}
        .action-btn.active{background:var(--accent-med);border-color:var(--accent);color:var(--accent-light)}

        .grid-wrapper{
            position:relative;width:min(92vw,450px);aspect-ratio:1;
            border-radius:14px;border:2.5px solid var(--border-thick);overflow:hidden;
            box-shadow:0 8px 40px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.03);
            user-select:none;-webkit-user-select:none;
        }
        .grid{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);width:100%;height:100%}

        .cell{
            background:var(--cell-bg);display:flex;align-items:center;justify-content:center;
            cursor:pointer;position:relative;
            border-right:1px solid var(--border);border-bottom:1px solid var(--border);transition:background .1s;
        }
        .cell:nth-child(9n){border-right:none}
        .cell:nth-child(n+73){border-bottom:none}
        .cell.box-right{border-right:2.5px solid var(--border-thick)}
        .cell.box-bottom{border-bottom:2.5px solid var(--border-thick)}
        .cell:hover{background:var(--cell-hover)}
        .cell.hl-row-col{background:var(--accent-dim)}
        .cell.hl-same{background:var(--accent-med)}
        .cell.hl-selected{background:var(--accent-strong)}
        .cell.hl-error-bg{background:var(--error-dim)}
        .cell-value{font-size:clamp(1.05rem,3.8vw,1.4rem);font-weight:600;line-height:1}
        .cell.given .cell-value{color:var(--given-color);font-weight:700}
        .cell.user .cell-value{color:var(--user-color)}
        .cell.error .cell-value{color:var(--error)}
        .cell-value.pop{animation:popIn .18s ease-out}
        @keyframes popIn{0%{transform:scale(.5);opacity:.4}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
        .cell.shake{animation:shake .35s ease-out}
        @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

        .cell-notes{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);width:88%;height:88%;position:absolute}
        .note-num{display:flex;align-items:center;justify-content:center;font-size:clamp(.4rem,1.4vw,.58rem);font-weight:500;color:var(--note-color);line-height:1}
        .cell.entering{opacity:0;animation:cellEnter .25s ease forwards}
        @keyframes cellEnter{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}

        /* ===== CIRCLE MENU ===== */
        .circle-menu{
            position:absolute;top:0;left:0;width:100%;height:100%;z-index:10;
            display:none;pointer-events:none;border-radius:14px;
        }
        .circle-menu.visible{display:block;pointer-events:auto}
        .circle-menu::before{
            content:'';position:absolute;inset:0;
            background:rgba(8,10,14,.55);border-radius:14px;
            opacity:0;transition:opacity .15s;
        }
        .circle-menu.visible::before{opacity:1}

        .circle-num{
            position:absolute;width:38px;height:38px;border-radius:50%;
            background:linear-gradient(145deg,#252b40,#1c2130);
            border:1.5px solid var(--border-thick);color:var(--fg);
            font-family:'Outfit',sans-serif;font-size:1rem;font-weight:600;
            cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:11;
            opacity:0;transform:scale(.2);
            transition:opacity .18s ease-out,transform .18s cubic-bezier(.34,1.56,.64,1),
                        background .1s,border-color .1s,color .1s;
            box-shadow:0 2px 10px rgba(0,0,0,.45);
            -webkit-tap-highlight-color:transparent;
            touch-action:manipulation;
        }
        .circle-menu.visible .circle-num{opacity:1;transform:scale(1)}
        .circle-num:active{transform:scale(.88)!important;background:var(--accent-dim)}
        .circle-num.completed{opacity:.12!important;pointer-events:none;transform:scale(.75)!important}
        .circle-num.matched{background:var(--accent-med);border-color:var(--accent);color:var(--accent-light)}

        /* Close X button in center */
        .circle-close{
            position:absolute;width:30px;height:30px;border-radius:50%;
            background:rgba(239,83,80,.12);border:1.5px solid rgba(239,83,80,.35);
            color:var(--error);font-size:.72rem;
            cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:12;
            opacity:0;transform:scale(.2);
            transition:opacity .18s ease-out .60s,transform .18s cubic-bezier(.34,1.56,.64,1) .60s,
                        background .1s,border-color .1s;
            box-shadow:0 2px 8px rgba(0,0,0,.3);
            -webkit-tap-highlight-color:transparent;
            touch-action:manipulation;
        }
        .circle-menu.visible .circle-close{opacity:1;transform:scale(1)}
        .circle-close:active{transform:scale(.8)!important;background:rgba(239,83,80,.28)}

        .new-game-btn{
            font-family:'Outfit',sans-serif;font-size:.85rem;font-weight:600;
            padding:11px 32px;border:none;border-radius:12px;
            background:var(--accent);color:#0b0d11;cursor:pointer;transition:all .2s;
        }
        .new-game-btn:hover{background:var(--accent-light);transform:translateY(-1px);box-shadow:0 4px 20px rgba(212,149,106,.3)}
        .new-game-btn:active{transform:translateY(0) scale(.97)}

        .toast{
            position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);
            padding:10px 22px;border-radius:10px;font-size:.82rem;font-weight:500;
            z-index:1000;pointer-events:none;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);white-space:nowrap;
        }
        .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
        .toast.error{background:var(--error);color:#fff}
        .toast.info{background:var(--card);color:var(--fg);border:1px solid var(--border)}

        .overlay{
            position:fixed;inset:0;background:rgba(5,6,9,.85);
            backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
            z-index:500;display:none;justify-content:center;align-items:center;opacity:0;transition:opacity .3s;
        }
        .overlay.visible{display:flex;opacity:1}
        .overlay-card{
            background:var(--card);border:1px solid var(--border);border-radius:20px;
            padding:36px 40px;text-align:center;max-width:340px;width:90%;
            box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.9);transition:transform .3s cubic-bezier(.4,0,.2,1);
        }
        .overlay.visible .overlay-card{transform:scale(1)}
        .overlay-card h2{font-size:1.5rem;font-weight:800;margin-bottom:6px}
        .overlay-card .sub{color:var(--fg-dim);font-size:.88rem;margin-bottom:22px;line-height:1.5}
        .overlay-card .stats-row{display:flex;justify-content:center;gap:24px;margin-bottom:24px}
        .overlay-card .stat-item{text-align:center}
        .overlay-card .stat-item .val{font-size:1.2rem;font-weight:700;color:var(--accent)}
        .overlay-card .stat-item .label{font-size:.68rem;color:var(--fg-dim);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
        .overlay-card button{
            font-family:'Outfit',sans-serif;font-size:.88rem;font-weight:600;
            padding:12px 36px;border:none;border-radius:12px;
            background:var(--accent);color:#0b0d11;cursor:pointer;transition:all .2s;
        }
        .overlay-card button:hover{background:var(--accent-light)}

        #confettiCanvas{position:fixed;inset:0;z-index:999;pointer-events:none}

        @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
        @media(max-width:380px){
            .tab{padding:4px 8px;font-size:.68rem}
            .action-btn{padding:7px 0;font-size:.65rem}
            .action-btn i{font-size:.8rem}
            .circle-num{width:34px;height:34px;font-size:.9rem}
            .circle-close{width:26px;height:26px;font-size:.65rem}
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <header><h1>Sudoku</h1></header>

        <div class="game-info">
            <div class="difficulty-tabs">
                <button class="tab" data-diff="easy">Easy</button>
                <button class="tab active" data-diff="medium">Medium</button>
                <button class="tab" data-diff="hard">Hard</button>
            </div>
            <div class="stats">
                <div class="stat"><i class="fa-regular fa-clock"></i><span id="timerDisplay">00:00</span></div>
                <div class="stat"><i class="fa-regular fa-heart"></i><span id="mistakesDisplay">0/3</span></div>
            </div>
        </div>

        <div class="actions">
            <button class="action-btn" id="undoBtn" aria-label="Undo"><i class="fa-solid fa-rotate-left"></i><span>Undo</span></button>
            <button class="action-btn" id="eraseBtn" aria-label="Erase"><i class="fa-regular fa-trash-can"></i><span>Erase</span></button>
            <button class="action-btn" id="notesBtn" aria-label="Notes"><i class="fa-regular fa-pen-to-square"></i><span>Notes</span></button>
            <button class="action-btn" id="hintBtn" aria-label="Hint"><i class="fa-regular fa-lightbulb"></i><span>Hint</span></button>
        </div>

        <div class="grid-wrapper">
            <div class="grid" id="grid"></div>
            <div class="circle-menu" id="circleMenu">
                <button class="circle-close" id="circleClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
                <button class="circle-num" data-num="1">1</button>
                <button class="circle-num" data-num="2">2</button>
                <button class="circle-num" data-num="3">3</button>
                <button class="circle-num" data-num="4">4</button>
                <button class="circle-num" data-num="5">5</button>
                <button class="circle-num" data-num="6">6</button>
                <button class="circle-num" data-num="7">7</button>
                <button class="circle-num" data-num="8">8</button>
                <button class="circle-num" data-num="9">9</button>
            </div>
        </div>

        <button class="new-game-btn" id="newGameBtn">New Game</button>
    </div>

    <div class="toast" id="toast"></div>

    <div class="overlay" id="gameOverOverlay">
        <div class="overlay-card">
            <h2 style="color:var(--error)">Game Over</h2>
            <p class="sub">You've made 3 mistakes. Better luck next time!</p>
            <button onclick="closeOverlay('gameOverOverlay');newGame(state.difficulty)">Try Again</button>
        </div>
    </div>
    <div class="overlay" id="winOverlay">
        <div class="overlay-card">
            <h2 style="color:var(--success)">Puzzle Solved</h2>
            <p class="sub">Excellent work! You cracked it.</p>
            <div class="stats-row">
                <div class="stat-item"><div class="val" id="winTime">--:--</div><div class="label">Time</div></div>
                <div class="stat-item"><div class="val" id="winDiff">--</div><div class="label">Difficulty</div></div>
                <div class="stat-item"><div class="val" id="winMistakes">0</div><div class="label">Mistakes</div></div>
            </div>
            <button onclick="closeOverlay('winOverlay');newGame(state.difficulty)">Play Again</button>
        </div>
    </div>

    <canvas id="confettiCanvas"></canvas>

<script>
    /* ===== STATE ===== */
    const state = {
        board: [], solution: [], given: [], notes: [],
        selected: null, notesMode: false,
        mistakes: 0, maxMistakes: 3,
        timer: 0, timerInterval: null,
        difficulty: 'medium', history: [],
        gameOver: false, gameWon: false,
    };
    const REMOVE_COUNT = { easy: 36, medium: 46, hard: 54 };
    let circleVisible = false;

    /* ===== GENERATION ===== */
    function shuffle(a) {
        const b = [...a];
        for (let i = b.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [b[i], b[j]] = [b[j], b[i]];
        }
        return b;
    }

    function isValid(B, r, c, n) {
        for (let i = 0; i < 9; i++) if (B[r][i] === n || B[i][c] === n) return false;
        const br = Math.floor(r / 3) * 3, bc = Math.floor(c / 3) * 3;
        for (let i = br; i < br + 3; i++)
            for (let j = bc; j < bc + 3; j++)
                if (B[i][j] === n) return false;
        return true;
    }

    function solveFill(B) {
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                if (B[r][c] === 0) {
                    for (const n of shuffle([1, 2, 3, 4, 5, 6, 7, 8, 9])) {
                        if (isValid(B, r, c, n)) {
                            B[r][c] = n;
                            if (solveFill(B)) return true;
                            B[r][c] = 0;
                        }
                    }
                    return false;
                }
            }
        }
        return true;
    }

    function countSolutions(B, count = 0) {
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                if (B[r][c] === 0) {
                    for (let n = 1; n <= 9; n++) {
                        if (isValid(B, r, c, n)) {
                            B[r][c] = n;
                            count = countSolutions(B, count);
                            B[r][c] = 0;
                            if (count >= 2) return count;
                        }
                    }
                    return count;
                }
            }
        }
        return count + 1;
    }

    function generatePuzzle(diff) {
        const B = Array.from({ length: 9 }, () => Array(9).fill(0));
        solveFill(B);
        const sol = B.map(r => [...r]);
        const pos = shuffle(Array.from({ length: 81 }, (_, i) => [Math.floor(i / 9), i % 9]));
        const targetRemove = REMOVE_COUNT[diff] || 46;
        let removed = 0;

        for (let i = 0; i < 81 && removed < targetRemove; i++) {
            const [r, c] = pos[i];
            const temp = B[r][c];
            B[r][c] = 0;

            const copy = B.map(row => [...row]);
            if (countSolutions(copy) !== 1) {
                B[r][c] = temp;
            } else {
                removed++;
            }
        }
        return { puzzle: B, solution: sol };
    }

    /* ===== GAME LOGIC ===== */
    function newGame(diff) {
        state.difficulty = diff;
        const { puzzle, solution } = generatePuzzle(diff);
        state.board = puzzle.map(r => [...r]);
        state.solution = solution;
        state.given = puzzle.map(r => r.map(v => v !== 0));
        state.notes = Array.from({ length: 9 }, () => Array.from({ length: 9 }, () => new Set()));
        state.selected = null;
        state.notesMode = false;
        state.mistakes = 0;
        state.history = [];
        state.gameOver = false;
        state.gameWon = false;
        stopTimer();
        state.timer = 0;
        updateTimerDisplay();
        updateMistakesDisplay();
        updateNotesBtn();
        updateDiffTabs();
        hideCircleMenu();
        createGrid();
    }

    function handleCellClick(row, col) {
        if (state.gameOver || state.gameWon) return;
        if (circleVisible) return;
        state.selected = [row, col];
        updateHighlights();
        if (!state.given[row][col]) showCircleMenu(row, col);
    }

    function selectCell(row, col) {
        if (state.gameOver || state.gameWon) return;
        hideCircleMenu();
        state.selected = [row, col];
        updateHighlights();
    }

    function placeNumber(num, fromCircle = false) {
        if (!state.selected || state.gameOver || state.gameWon) return;
        const [r, c] = state.selected;
        if (state.given[r][c]) return;

        if (state.notesMode) {
            const pv = state.board[r][c];
            const pn = new Set([...state.notes[r][c]]);
            state.history.push({ r, c, prevValue: pv, prevNotes: pn });
            if (pv !== 0) state.board[r][c] = 0;
            if (state.notes[r][c].has(num)) state.notes[r][c].delete(num);
            else state.notes[r][c].add(num);
            renderCell(r, c);
            updateCircleBtns();
            return;
        }

        const pv = state.board[r][c];
        const pn = new Set([...state.notes[r][c]]);
        state.history.push({ r, c, prevValue: pv, prevNotes: pn });
        state.board[r][c] = num;
        state.notes[r][c].clear();
        if (!state.timerInterval) startTimer();

        const cell = getCell(r, c);
        const correct = num === state.solution[r][c];

        if (!correct) {
            state.mistakes++;
            updateMistakesDisplay();
            renderCell(r, c, true);
            cell.classList.add('shake');
            setTimeout(() => cell.classList.remove('shake'), 400);
            showToast('Wrong number', 'error');
            if (state.mistakes >= state.maxMistakes) {
                state.gameOver = true;
                stopTimer();
                hideCircleMenu();
                setTimeout(() => showOverlay('gameOverOverlay'), 600);
                return;
            }
            updateHighlights();
            updateCircleBtns();
            return;
        }

        renderCell(r, c, false, true);
        clearRelatedNotes(r, c, num);
        updateHighlights();

        if (checkWin()) {
            state.gameWon = true;
            stopTimer();
            hideCircleMenu();
            setTimeout(() => { showWinScreen(); startConfetti(); }, 300);
            return;
        }
        if (fromCircle) hideCircleMenu();
    }

    function erase() {
        if (!state.selected || state.gameOver || state.gameWon) return;
        const [r, c] = state.selected;
        if (state.given[r][c]) return;
        const pv = state.board[r][c];
        const pn = new Set([...state.notes[r][c]]);
        if (pv === 0 && pn.size === 0) return;
        state.history.push({ r, c, prevValue: pv, prevNotes: pn });
        state.board[r][c] = 0;
        state.notes[r][c].clear();
        renderCell(r, c);
        updateHighlights();
        if (circleVisible) updateCircleBtns();
    }

    function undo() {
        if (!state.history.length || state.gameOver || state.gameWon) return;
        const a = state.history.pop();
        state.board[a.r][a.c] = a.prevValue;
        state.notes[a.r][a.c] = new Set([...a.prevNotes]);
        renderCell(a.r, a.c);
        updateHighlights();
        if (circleVisible) updateCircleBtns();
    }

    function getHint() {
        if (!state.selected || state.gameOver || state.gameWon) return;
        const [r, c] = state.selected;
        if (state.given[r][c]) { showToast('Already given', 'info'); return; }
        if (state.board[r][c] === state.solution[r][c]) { showToast('Already correct', 'info'); return; }
        state.history.push({ r, c, prevValue: state.board[r][c], prevNotes: new Set([...state.notes[r][c]]) });
        state.board[r][c] = state.solution[r][c];
        state.notes[r][c].clear();
        if (!state.timerInterval) startTimer();
        renderCell(r, c, false, true);
        clearRelatedNotes(r, c, state.solution[r][c]);
        updateHighlights();
        hideCircleMenu();
        showToast('Hint revealed', 'info');
        if (checkWin()) {
            state.gameWon = true;
            stopTimer();
            setTimeout(() => { showWinScreen(); startConfetti(); }, 300);
        }
    }

    function toggleNotesMode() { state.notesMode = !state.notesMode; updateNotesBtn(); }

    function clearRelatedNotes(row, col, num) {
        for (let i = 0; i < 9; i++) {
            if (state.notes[row][i].delete(num)) renderCell(row, i);
            if (state.notes[i][col].delete(num)) renderCell(i, col);
        }
        const br = Math.floor(row / 3) * 3, bc = Math.floor(col / 3) * 3;
        for (let r = br; r < br + 3; r++) {
            for (let c = bc; c < bc + 3; c++) {
                if (state.notes[r][c].delete(num)) renderCell(r, c);
            }
        }
    }

    function checkWin() {
        for (let r = 0; r < 9; r++)
            for (let c = 0; c < 9; c++)
                if (state.board[r][c] !== state.solution[r][c]) return false;
        return true;
    }

    /* ===== CIRCLE MENU ===== */
    function getBtnSize() {
        return parseInt(getComputedStyle(document.documentElement).fontSize) < 14 ? 34 : 38;
    }

    function positionCircle(row, col) {
        const grid = document.getElementById('grid');
        const rect = grid.getBoundingClientRect();
        const gw = grid.offsetWidth, cellSize = gw / 9;
        const btnSize = getBtnSize(), half = btnSize / 2, radius = cellSize * 1.55;
        let cx = (col + .5) * cellSize, cy = (row + .5) * cellSize;

        for (let it = 0; it < 3; it++) {
            let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
            for (let i = 0; i < 9; i++) {
                const a = (-90 + i * 40) * Math.PI / 180;
                const bx = cx + Math.cos(a) * radius - half;
                const by = cy + Math.sin(a) * radius - half;
                x0 = Math.min(x0, bx); x1 = Math.max(x1, bx + btnSize);
                y0 = Math.min(y0, by); y1 = Math.max(y1, by + btnSize);
            }
            let ox = 0, oy = 0;

            if (x0 < 2) ox = -x0 + 2;
            else if (x1 > gw - 2) ox = -(x1 - gw) - 2;

            if (y0 < 2) oy = -y0 + 2;
            else if (y1 > gw - 2) oy = -(y1 - gw) - 2;

            const screenX0 = rect.left + (cx - radius - half);
            const screenX1 = rect.left + (cx + radius + half);
            const screenY0 = rect.top + (cy - radius - half);
            const screenY1 = rect.top + (cy + radius + half);

            if (screenX0 < 10) ox += (10 - screenX0);
            if (screenX1 > window.innerWidth - 10) ox -= (screenX1 - (window.innerWidth - 10));
            if (screenY0 < 10) oy += (10 - screenY0);
            if (screenY1 > window.innerHeight - 10) oy -= (screenY1 - (window.innerHeight - 10));

            cx += ox; cy += oy;
            if (ox === 0 && oy === 0) break;
        }

        document.querySelectorAll('.circle-num').forEach((btn, i) => {
            const a = (-90 + i * 40) * Math.PI / 180;
            btn.style.width = btnSize + 'px'; btn.style.height = btnSize + 'px';
            btn.style.left = (cx + Math.cos(a) * radius - half) + 'px';
            btn.style.top = (cy + Math.sin(a) * radius - half) + 'px';
        });

        const closeBtn = document.getElementById('circleClose');
        const closeSize = parseInt(getComputedStyle(closeBtn).width) || 30;
        const closeHalf = closeSize / 2;
        closeBtn.style.left = (cx - closeHalf) + 'px';
        closeBtn.style.top = (cy - closeHalf) + 'px';
    }

    function showCircleMenu(row, col) {
        positionCircle(row, col);
        document.querySelectorAll('.circle-num').forEach((b, i) => b.style.transitionDelay = i * 18 + 'ms');
        document.getElementById('circleClose').style.transitionDelay = '0ms';
        updateCircleBtns();
        document.getElementById('circleMenu').classList.add('visible');
        circleVisible = true;
    }

    function hideCircleMenu() {
        document.getElementById('circleMenu').classList.remove('visible');
        circleVisible = false;
    }

    function repositionCircle(row, col) {
        const allBtns = document.querySelectorAll('.circle-num');
        const closeBtn = document.getElementById('circleClose');
        allBtns.forEach(b => { b.style.transition = 'background .1s,border-color .1s,color .1s'; b.style.transitionDelay = '0ms'; });
        closeBtn.style.transition = 'background .1s,border-color .1s,color .1s';
        closeBtn.style.transitionDelay = '0ms';
        positionCircle(row, col);
        void allBtns[0].offsetWidth;
        allBtns.forEach(b => b.style.transition = '');
        closeBtn.style.transition = '';
        updateCircleBtns();
    }

    function updateCircleBtns() {
        const cnt = Array(10).fill(0);
        for (let r = 0; r < 9; r++)
            for (let c = 0; c < 9; c++)
                if (state.board[r][c] !== 0) cnt[state.board[r][c]]++;
        let sn = 0;
        if (state.selected) sn = state.board[state.selected[0]][state.selected[1]];
        document.querySelectorAll('.circle-num').forEach(b => {
            const n = +b.dataset.num;
            b.classList.toggle('completed', cnt[n] >= 9);
            b.classList.toggle('matched', n === sn && sn !== 0);
        });
    }

    function advanceToNextCell() {
        if (!state.selected) return false;
        const [sr, sc] = state.selected;
        for (let i = sr * 9 + sc + 1; i < 81; i++) {
            const r = Math.floor(i / 9), c = i % 9;
            if (state.board[r][c] === 0) {
                state.selected = [r, c];
                updateHighlights();
                repositionCircle(r, c);
                return true;
            }
        }
        state.selected = null;
        hideCircleMenu();
        updateHighlights();
        return false;
    }

    function dismissCircle() {
        state.selected = null;
        hideCircleMenu();
        updateHighlights();
    }

    /* ===== RENDERING ===== */
    function getCell(r, c) { return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`); }

    function createGrid() {
        const grid = document.getElementById('grid'); grid.innerHTML = '';
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell entering'; cell.dataset.row = r; cell.dataset.col = c;
                if (c === 2 || c === 5) cell.classList.add('box-right');
                if (r === 2 || r === 5) cell.classList.add('box-bottom');
                cell.style.animationDelay = (r * 9 + c) * 6 + 'ms';
                const vs = document.createElement('span'); vs.className = 'cell-value'; cell.appendChild(vs);
                const nd = document.createElement('div'); nd.className = 'cell-notes'; nd.style.display = 'none';
                for (let n = 1; n <= 9; n++) {
                    const s = document.createElement('span'); s.className = 'note-num'; s.dataset.note = n; nd.appendChild(s);
                }
                cell.appendChild(nd);
                cell.addEventListener('click', () => handleCellClick(r, c));
                grid.appendChild(cell);
            }
        }
        for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) renderCell(r, c);
        setTimeout(() => document.querySelectorAll('.cell.entering').forEach(c => c.classList.remove('entering')), 81 * 6 + 250);
    }

    function renderCell(r, c, isError = false, animate = false) {
        const cell = getCell(r, c); if (!cell) return;
        const val = state.board[r][c], vs = cell.querySelector('.cell-value'), nd = cell.querySelector('.cell-notes');
        cell.classList.remove('given', 'user', 'error');
        if (val !== 0) {
            vs.textContent = val; vs.style.display = ''; nd.style.display = 'none';
            if (state.given[r][c]) cell.classList.add('given');
            else {
                cell.classList.add('user');
                if (isError || val !== state.solution[r][c]) cell.classList.add('error');
            }
            if (animate) { vs.classList.remove('pop'); void vs.offsetWidth; vs.classList.add('pop'); }
        } else {
            vs.textContent = ''; vs.style.display = 'none';
            const notes = state.notes[r][c];
            if (notes.size > 0) {
                nd.style.display = 'grid';
                nd.querySelectorAll('.note-num').forEach(s => { s.textContent = notes.has(+s.dataset.note) ? s.dataset.note : ''; });
            } else nd.style.display = 'none';
        }
    }

    function updateHighlights() {
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('hl-selected', 'hl-row-col', 'hl-same', 'hl-error-bg'));
        if (!state.selected) return;
        const [sr, sc] = state.selected, sv = state.board[sr][sc];
        const sbr = Math.floor(sr / 3) * 3, sbc = Math.floor(sc / 3) * 3;
        for (let r = 0; r < 9; r++) {
            for (let c = 0; c < 9; c++) {
                const cell = getCell(r, c); if (!cell) continue;
                if (r === sr && c === sc) cell.classList.add('hl-selected');
                else if (sv !== 0 && state.board[r][c] === sv) cell.classList.add('hl-same');
                else if (r === sr || c === sc || (r >= sbr && r < sbr + 3 && c >= sbc && c < sbc + 3)) cell.classList.add('hl-row-col');
                if (sv !== 0 && !state.given[sr][sc] && state.board[sr][sc] !== state.solution[sr][sc]
                    && state.board[r][c] === sv && !(r === sr && c === sc)) cell.classList.add('hl-error-bg');
            }
        }
    }

    function updateNotesBtn() { document.getElementById('notesBtn').classList.toggle('active', state.notesMode); }
    function updateDiffTabs() { document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.diff === state.difficulty)); }
    function updateMistakesDisplay() { document.getElementById('mistakesDisplay').innerHTML = `<span class="${state.mistakes > 0 ? 'error-count' : ''}">${state.mistakes}</span>/${state.maxMistakes}`; }

    /* ===== TIMER ===== */
    function startTimer() { if (state.timerInterval) return; state.timerInterval = setInterval(() => { state.timer++; updateTimerDisplay(); }, 1000); }
    function stopTimer() { clearInterval(state.timerInterval); state.timerInterval = null; }
    function updateTimerDisplay() { document.getElementById('timerDisplay').textContent = `${String(Math.floor(state.timer / 60)).padStart(2, '0')}:${String(state.timer % 60).padStart(2, '0')}`; }

    /* ===== TOAST ===== */
    let toastTO = null;
    function showToast(msg, type = 'info') {
        const el = document.getElementById('toast'); el.textContent = msg; el.className = `toast ${type}`;
        clearTimeout(toastTO);
        requestAnimationFrame(() => { el.classList.add('show'); toastTO = setTimeout(() => el.classList.remove('show'), 1800); });
    }

    /* ===== OVERLAYS ===== */
    function showOverlay(id) { const el = document.getElementById(id); el.style.display = 'flex'; requestAnimationFrame(() => el.classList.add('visible')); }
    function closeOverlay(id) { const el = document.getElementById(id); el.classList.remove('visible'); setTimeout(() => el.style.display = 'none', 300); }
    function showWinScreen() {
        document.getElementById('winTime').textContent = `${String(Math.floor(state.timer / 60)).padStart(2, '0')}:${String(state.timer % 60).padStart(2, '0')}`;
        document.getElementById('winDiff').textContent = { easy: 'Easy', medium: 'Medium', hard: 'Hard' }[state.difficulty];
        document.getElementById('winMistakes').textContent = state.mistakes;
        showOverlay('winOverlay');
    }

    /* ===== CONFETTI ===== */
    function startConfetti() {
        const cv = document.getElementById('confettiCanvas'), ctx = cv.getContext('2d');
        cv.width = innerWidth; cv.height = innerHeight;
        const cols = ['#d4956a', '#e8b898', '#66bb6a', '#ef5350', '#42a5f5', '#fdd835', '#ab47bc', '#fff'];
        const P = [];
        for (let i = 0; i < 160; i++) P.push({
            x: cv.width * .5 + (Math.random() - .5) * 200, y: cv.height * .4,
            vx: (Math.random() - .5) * 15, vy: -Math.random() * 17 - 4,
            w: Math.random() * 8 + 4, h: Math.random() * 5 + 3,
            color: cols[Math.floor(Math.random() * cols.length)],
            rot: Math.random() * Math.PI * 2, rv: (Math.random() - .5) * .3,
            life: 1, decay: .005 + Math.random() * .008,
        });
        let id;
        (function anim() {
            ctx.clearRect(0, 0, cv.width, cv.height); let alive = false;
            for (const p of P) {
                if (p.life <= 0) continue; alive = true;
                p.vy += .35; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.rot += p.rv; p.life -= p.decay;
                ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
                ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
            }
            if (alive) id = requestAnimationFrame(anim);
            else { ctx.clearRect(0, 0, cv.width, cv.height); cancelAnimationFrame(id); }
        })();
    }

    /* ===== KEYBOARD ===== */
    document.addEventListener('keydown', e => {
        if (state.gameOver || state.gameWon) return;
        const num = parseInt(e.key);
        if (num >= 1 && num <= 9) { placeNumber(num, false); return; }
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            e.preventDefault(); let [r, c] = state.selected || [4, 4];
            if (e.key === 'ArrowUp') r = Math.max(0, r - 1);
            if (e.key === 'ArrowDown') r = Math.min(8, r + 1);
            if (e.key === 'ArrowLeft') c = Math.max(0, c - 1);
            if (e.key === 'ArrowRight') c = Math.min(8, c + 1);
            selectCell(r, c); return;
        }
        if (e.key === 'Backspace' || e.key === 'Delete') { e.preventDefault(); erase(); return; }
        if (e.key === 'n' || e.key === 'N') { toggleNotesMode(); return; }
        if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); return; }
        if (e.key === 'h' || e.key === 'H') { getHint(); return; }
    });

    /* ===== EVENT LISTENERS ===== */
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => newGame(t.dataset.diff)));
    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('eraseBtn').addEventListener('click', erase);
    document.getElementById('notesBtn').addEventListener('click', toggleNotesMode);
    document.getElementById('hintBtn').addEventListener('click', getHint);
    document.getElementById('newGameBtn').addEventListener('click', () => newGame(state.difficulty));

    document.querySelectorAll('.circle-num').forEach(btn => {
        btn.addEventListener('click', e => { e.stopPropagation(); placeNumber(+btn.dataset.num, true); });
    });

    document.getElementById('circleClose').addEventListener('click', e => { e.stopPropagation(); dismissCircle(); });

    document.getElementById('circleMenu').addEventListener('click', e => {
        if (!e.target.closest('.circle-num') && !e.target.closest('.circle-close')) dismissCircle();
    });

    window.addEventListener('resize', () => {
        const cv = document.getElementById('confettiCanvas'); cv.width = innerWidth; cv.height = innerHeight;
        if (circleVisible && state.selected) repositionCircle(state.selected[0], state.selected[1]);
    });

    /* ===== INIT ===== */
    newGame('medium');
</script>
</body>
